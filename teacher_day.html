<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>روز معلم مبارک</title>
    <style>
        body {
            background: #fff0f5;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            direction: rtl;
            padding: 50px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            display: inline-block;
            max-width: 500px;
            animation: fadeIn 2s ease-in-out;
        }
        .flowers {
            font-size: 24px;
            margin: 15px 0;
        }
        h1 {
            color: #d63384;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #333;
        }
        .signature {
            margin-top: 30px;
            color: #006400;
            font-style: italic;
        }
        @keyframes fadeIn {
            from {opacity: 0; transform: scale(0.9);}
            to {opacity: 1; transform: scale(1);}
        }
    </style>
</head>
<body>
    <div class="flowers">🌸🌼🌺🌷🌸🌼🌺🌷</div>
    <div class="card">
        <h1>🎓 روز معلم مبارک 🎓</h1>
        <p>استاد عزیزم روزت مبارک باشه،امیدوارم سال ها سلامت و با شادی زندگی کنی.</p>
        <p>خیلی ممنونم بابت همه چی 🌹</p>
        <div class="signature">با احترام و آرزوی بهترین‌ها 🌷</div>
    </div>
    <div class="flowers">🌸🌼🌺🌷🌸🌼🌺🌷</div>
</body>
</html>
